<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Usage Limit</title>
  <style>
    body {
      margin: 0;
      padding: 8px 10px 12px 0;
      background: #2d2d2d;
      color: #d8d8d8;
      font: 12px/1.4 "Segoe UI", sans-serif;
    }
    .row { display: flex; align-items: center; min-height: 32px; }
    .row > label { flex: 0 0 96px; text-align: right; padding-right: 10px; color: #9a9a9a; }
    .row > .control { flex: 1; min-width: 0; }
    select, input {
      width: 100%;
      box-sizing: border-box;
      height: 26px;
      padding: 0 6px;
      background: #3d3d3d;
      color: #d8d8d8;
      border: 1px solid #3d3d3d;
      border-radius: 3px;
      font: inherit;
    }
    select:focus, input:focus { outline: none; border-color: #6c6c6c; }
    select:disabled { color: #7a7a7a; }
    .hint { margin: 6px 0 0 106px; color: #8a8a8a; font-size: 11px; }
  </style>
</head>
<body>
  <div class="row">
    <label for="provider" data-i18n="provider">Provider</label>
    <div class="control"><select id="provider"></select></div>
  </div>
  <div class="row">
    <label for="limit" data-i18n="limit">Limit</label>
    <div class="control"><select id="limit" disabled></select></div>
  </div>
  <div class="row">
    <label for="label" data-i18n="label">Label</label>
    <div class="control"><input id="label" type="text" maxlength="24"></div>
  </div>
  <p class="hint" id="status"></p>
  <p class="hint" data-i18n="howto">Press: time until reset. Hold: refresh now.</p>

  <script>
    const STRINGS = {
      en: {
        provider: 'Provider', limit: 'Limit', label: 'Label', auto: 'Automatic',
        loading: 'Loading…', none: 'Not signed in on this PC',
        viaWidget: 'Reading from GenAIUsageWidget.', viaLocal: 'Fetching directly (GenAIUsageWidget is not running).',
        howto: 'Press: time until reset. Hold: refresh now.',
      },
      ja: {
        provider: 'プロバイダ', limit: '制限', label: 'ラベル', auto: '自動',
        loading: '読み込み中…', none: 'このPCでサインインしていません',
        viaWidget: 'GenAIUsageWidget から読み込み中',
        viaLocal: '直接取得中（GenAIUsageWidget は起動していません）',
        howto: '押す: リセットまでの時間 / 長押し: 今すぐ更新',
      },
    };

    let socket = null;
    let context = null;
    let action = null;
    let settings = {};
    let t = STRINGS.en;

    const $ = (id) => document.getElementById(id);

    function send(event, payload) {
      socket.send(JSON.stringify({ event, context, action, payload }));
    }

    function save() {
      send('setSettings', settings);
    }

    function requestLimits() {
      $('limit').disabled = true;
      $('limit').innerHTML = `<option>${t.loading}</option>`;
      send('sendToPlugin', { event: 'getLimits', provider: settings.provider });
    }

    function showLimits(message) {
      if (message.provider !== settings.provider) return;
      const select = $('provider');
      if (select.options.length === 0) {
        for (const p of message.providers) select.add(new Option(p.label, p.id));
        select.value = settings.provider;
      }

      const limits = $('limit');
      limits.innerHTML = '';
      if (message.limits.length === 0) {
        limits.add(new Option(message.loaded ? t.none : t.loading, ''));
        limits.disabled = true;
      } else {
        for (const l of message.limits) limits.add(new Option(l.label, l.id));
        limits.disabled = false;
        const chosen = message.limits.find((l) => l.id === settings.limit) ?? message.limits[0];
        limits.value = chosen.id;
        if (settings.limit !== chosen.id || settings.limitLabel !== chosen.label) {
          settings.limit = chosen.id;
          settings.limitLabel = chosen.label;
          save();
        }
      }
      $('status').textContent = message.via === 'widget' ? t.viaWidget : message.via === 'local' ? t.viaLocal : '';
    }

    // Called by Stream Deck when the inspector opens.
    // eslint-disable-next-line no-unused-vars
    function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
      context = uuid;
      const parsedAction = JSON.parse(actionInfo);
      action = parsedAction.action;
      settings = { provider: 'claude', ...parsedAction.payload.settings };
      t = STRINGS[JSON.parse(info).application.language] ?? STRINGS.en;
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];
      $('label').placeholder = t.auto;
      $('label').value = settings.label ?? '';

      socket = new WebSocket(`ws://127.0.0.1:${port}`);
      socket.onopen = () => {
        socket.send(JSON.stringify({ event: registerEvent, uuid }));
        requestLimits();
      };
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.event === 'sendToPropertyInspector' && message.payload?.event === 'limits') {
          showLimits(message.payload);
        }
      };
    }

    $('provider').addEventListener('change', (event) => {
      settings = { ...settings, provider: event.target.value, limit: '', limitLabel: '' };
      save();
      requestLimits();
    });
    $('limit').addEventListener('change', (event) => {
      settings.limit = event.target.value;
      settings.limitLabel = event.target.selectedOptions[0]?.textContent ?? '';
      save();
    });
    $('label').addEventListener('input', (event) => {
      settings.label = event.target.value.trim();
      save();
    });
  </script>
</body>
</html>
