<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>GenAIUsageWidget</title>
<style>
  :root {
    color-scheme: dark;
    --notch: #0a0a0a;
    --flyout: #141414;
    --text-primary: #f5f5f5;
    --text-secondary: #a3a3a3;
    --text-muted: #737373;
    --track: #2a2a2a;
    --hairline: rgba(255, 255, 255, 0.08);
    --ok: #3dff8a;
    --warning: #f0d44a;
    --critical: #ff5c33;
    --accent: #3dff8a;
    --pointer-offset: 40px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: transparent;
    color: var(--text-primary);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    overflow: hidden;
  }

  .app {
    position: relative;
    margin: 10px;
  }

  html.widget-edge-fill,
  html.widget-edge-fill body {
    width: 100%;
    height: 100%;
  }

  .shell {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 10px;
  }

  body.widget-mode.edge-left .shell {
    flex-direction: row-reverse;
  }

  body.widget-mode.edge-top .shell {
    flex-direction: column-reverse;
    align-items: stretch;
  }

  body:not(.widget-mode) .shell {
    display: block;
  }

  .panel {
    display: none;
    flex-shrink: 0;
  }

  .panel.open {
    display: block;
  }

  body:not(.widget-mode) .panel {
    display: none !important;
  }

  .flyout {
    position: relative;
    width: 268px;
    padding: 16px 18px 14px;
    border-radius: 22px;
    background: var(--flyout);
    border: 1px solid var(--hairline);
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .flyout .pointer {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--flyout);
    border: 1px solid var(--hairline);
    border-left: none;
    border-bottom: none;
    transform: rotate(45deg);
    right: -6px;
    top: var(--pointer-offset);
    margin-top: -6px;
    box-shadow: 4px -4px 12px rgba(0, 0, 0, 0.12);
  }

  body.widget-mode.edge-left .flyout .pointer {
    right: auto;
    left: -6px;
    transform: rotate(225deg);
  }

  body.widget-mode.edge-top .flyout .pointer {
    right: auto;
    left: var(--pointer-offset);
    top: -6px;
    margin-top: 0;
    margin-left: -6px;
    transform: rotate(-45deg);
  }

  .flyout-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .flyout-head svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .flyout-error,
  .flyout-empty {
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-secondary);
  }

  .flyout-error { color: var(--critical); }

  .flyout-updated {
    margin-top: 12px;
    font-size: 10px;
    color: var(--text-muted);
  }

  .notch {
    position: relative;
    background: var(--notch);
    border: 1px solid var(--hairline);
    box-shadow:
      0 16px 40px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  body.widget-mode .notch {
    width: 84px;
    padding: 16px 10px 10px;
    border-radius: 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-app-region: drag;
  }

  body.widget-mode.edge-top .notch {
    width: auto;
    min-height: 84px;
    padding: 10px 14px;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  body:not(.widget-mode) .notch {
    width: 300px;
    padding: 12px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  body:not(.widget-mode) #settings-panel.flyout {
    width: auto;
    padding: 4px 2px 0;
    background: transparent;
    border: none;
    box-shadow: none;
  }

  body:not(.widget-mode) .tile:not(.error-state) .tile-sub {
    display: none;
  }

  body.widget-mode .app-header {
    order: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: 8px;
    -webkit-app-region: no-drag;
  }

  body.widget-mode .app-title,
  body.widget-mode .app-updated {
    display: none;
  }

  body.widget-mode.edge-top .app-header {
    order: 0;
    padding-top: 0;
    padding-right: 4px;
  }

  body:not(.widget-mode) .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 6px;
    gap: 8px;
  }

  .app-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .app-header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    -webkit-app-region: no-drag;
  }

  .app-updated {
    font-size: 10px;
    color: var(--text-muted);
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .icon-btn svg {
    width: 14px;
    height: 14px;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
  }

  .hide-edge-btn { display: none; }

  body.widget-mode .hide-edge-btn { display: flex; }

  body.widget-mode.edge-collapsed .app {
    margin: 0;
    padding: 0;
    min-height: 0;
    width: 100%;
    height: 100%;
  }

  /* Peek is the only hit target while collapsed. The notch stays in the
     DOM but is hidden: otherwise its drag region sits on top of the peek
     and clicks never fire showWidgetFromEdge. */
  body.widget-mode.edge-collapsed .shell {
    display: none !important;
  }

  body.widget-mode.edge-collapsed .edge-peek-tab {
    display: flex;
    position: absolute;
    inset: 0;
    z-index: 5;
    width: 100%;
    height: 100%;
    min-width: 28px;
    min-height: 28px;
  }

  .edge-peek-tab {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 28px;
    height: 28px;
    padding: 0;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    -webkit-app-region: no-drag;
    cursor: pointer;
    user-select: none;
    background: var(--notch);
  }

  body.widget-mode.edge-collapsed.edge-left .edge-peek-tab,
  body.widget-mode.edge-collapsed.edge-right .edge-peek-tab {
    width: 100%;
    min-width: 28px;
    height: 100%;
    min-height: 100%;
  }

  body.widget-mode.edge-collapsed.edge-top .edge-peek-tab::before { content: "▾"; }
  body.widget-mode.edge-collapsed.edge-left .edge-peek-tab::before { content: "▸"; }
  body.widget-mode.edge-collapsed.edge-right .edge-peek-tab::before { content: "◂"; }

  #settings-panel[hidden],
  #flyout[hidden],
  #cards-view[hidden] {
    display: none !important;
  }

  .settings-section + .settings-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
  }

  .settings-heading {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
  }

  .settings-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--ok);
    flex-shrink: 0;
  }

  .provider-toggle + .provider-toggle { margin-top: 8px; }

  .provider-toggle.disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .provider-toggle-note {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .settings-back {
    margin-top: 14px;
    align-self: flex-start;
    padding: 6px 12px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .settings-back:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
  }

  #cards-view {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  body.widget-mode #cards-view {
    width: 100%;
    align-items: center;
    gap: 12px;
  }

  body.widget-mode.edge-top #cards-view {
    flex-direction: row;
    width: auto;
    gap: 14px;
  }

  .tile {
    user-select: none;
  }

  body.widget-mode .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    -webkit-app-region: no-drag;
    cursor: pointer;
  }

  body.widget-mode .tile.selected .ring-icon {
    color: #fff;
  }

  body.widget-mode .tile.dragging { opacity: 0.4; }

  body:not(.widget-mode) .tile {
    padding: 14px 14px 12px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--hairline);
  }

  body:not(.widget-mode) .tile + .tile {
    margin-top: 0;
  }

  body:not(.widget-mode) #cards-view {
    gap: 10px;
  }

  body:not(.widget-mode) .tile.dragging { opacity: 0.45; }

  .tile-body { display: none; }

  body:not(.widget-mode) .tile-body { display: block; }

  body:not(.widget-mode) .ring-item { display: none; }

  .ring-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .ring {
    position: relative;
    width: 56px;
    height: 56px;
  }

  .ring-svg {
    width: 56px;
    height: 56px;
    display: block;
    overflow: visible;
  }

  .ring-track,
  .ring-fill {
    fill: none;
    stroke-width: 3.4;
  }

  .ring-track { stroke: var(--track); }

  .ring-fill {
    stroke: var(--ok);
    stroke-linecap: round;
    stroke-dasharray: 0 100;
    transition: stroke-dasharray 0.55s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.3s ease;
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--ok) 55%, transparent));
  }

  .ring.warning .ring-fill {
    stroke: var(--warning);
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--warning) 50%, transparent));
  }

  .ring.critical .ring-fill {
    stroke: var(--critical);
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--critical) 55%, transparent));
  }

  .ring-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    pointer-events: none;
  }

  .ring-icon svg {
    width: 18px;
    height: 18px;
  }

  .ring-value {
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .tile-status {
    display: none;
    font-size: 10px;
    line-height: 1;
  }

  .tile.stale .tile-status.stale-icon,
  .tile.error-state .tile-status.error-icon {
    display: inline;
  }

  .meter {
    height: 7px;
    border-radius: 99px;
    background: var(--track);
    overflow: hidden;
  }

  .meter.ok { background: color-mix(in srgb, var(--ok) 18%, #1a1a1a); }
  .meter.warning { background: color-mix(in srgb, var(--warning) 18%, #1a1a1a); }
  .meter.critical { background: color-mix(in srgb, var(--critical) 18%, #1a1a1a); }

  .meter-fill {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: var(--ok);
    box-shadow: 0 0 10px color-mix(in srgb, var(--ok) 45%, transparent);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
  }

  .meter.warning .meter-fill {
    background: var(--warning);
    box-shadow: 0 0 10px color-mix(in srgb, var(--warning) 45%, transparent);
  }

  .meter.critical .meter-fill {
    background: var(--critical);
    box-shadow: 0 0 10px color-mix(in srgb, var(--critical) 45%, transparent);
  }

  .detail-row + .detail-row {
    margin-top: 14px;
  }

  .detail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .detail-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .detail-reset {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    text-align: right;
  }

  .detail-used {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .tile-sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.45;
    white-space: pre-line;
  }

  body.widget-mode .tile-sub { display: none; }

  .tile-sub.error { color: var(--critical); }

  .tile-hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .tile-hint[hidden] { display: none !important; }

  .tile-empty {
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  body:not(.widget-mode) .tile-empty {
    padding: 20px 12px;
    font-size: 12px;
  }

  body.widget-mode .empty-long { display: none; }
  body:not(.widget-mode) .empty-short { display: none; }

  body.compact-mode:not(.widget-mode) #cards-view { gap: 8px; }
  body.compact-mode:not(.widget-mode) .tile { padding: 10px 12px; }
  body.compact-mode:not(.widget-mode) .detail-reset { display: none; }
  body.compact-mode:not(.widget-mode) .flyout-head { margin-bottom: 10px; }
  body.compact-mode.widget-mode .ring-value { display: none; }
  body.compact-mode.widget-mode .ring,
  body.compact-mode.widget-mode .ring-svg {
    width: 48px;
    height: 48px;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-fill, .meter-fill { transition: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="edge-peek-tab" id="edge-peek-tab" title="Click to open"></div>

    <div class="shell">
      <div class="panel" id="panel">
        <div class="flyout" id="flyout" hidden>
          <span class="pointer" aria-hidden="true"></span>
          <div id="flyout-content"></div>
        </div>
        <div class="flyout settings-flyout" id="settings-panel" hidden>
          <div class="flyout-head">Settings</div>
          <div class="settings-section">
            <label class="settings-row">
              <span>Compact mode</span>
              <input type="checkbox" id="compact-mode-toggle" />
            </label>
          </div>
          <div class="settings-section">
            <div class="settings-heading">Providers</div>
            <div id="provider-toggles"></div>
          </div>
          <button type="button" id="settings-back-btn" class="settings-back">Back</button>
        </div>
      </div>

      <div class="notch" id="notch">
        <div class="app-header">
          <span class="app-title">AI Usage</span>
          <div class="app-header-actions">
            <span class="app-updated" id="last-updated"></span>
            <button type="button" id="hide-edge-btn" class="icon-btn hide-edge-btn" aria-label="Hide to nearest edge" title="Hide to nearest edge">
              <svg id="hide-edge-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10.5 8 5.5 13 10.5"/></svg>
            </button>
            <button type="button" id="settings-btn" class="icon-btn settings-btn" aria-label="Settings">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 5.4A2.6 2.6 0 1 0 8 10.6 2.6 2.6 0 0 0 8 5.4Zm6.2 2.1-.9-.2a5 5 0 0 0-.4-1l.6-.7a.6.6 0 0 0 0-.8l-.8-.8a.6.6 0 0 0-.8 0l-.7.6a5 5 0 0 0-1-.4l-.2-.9A.6.6 0 0 0 9.4 2H6.6a.6.6 0 0 0-.6.5l-.2.9a5 5 0 0 0-1 .4l-.7-.6a.6.6 0 0 0-.8 0l-.8.8a.6.6 0 0 0 0 .8l.6.7a5 5 0 0 0-.4 1l-.9.2A.6.6 0 0 0 2 6.6v2.8a.6.6 0 0 0 .5.6l.9.2a5 5 0 0 0 .4 1l-.6.7a.6.6 0 0 0 0 .8l.8.8a.6.6 0 0 0 .8 0l.7-.6a5 5 0 0 0 1 .4l.2.9a.6.6 0 0 0 .6.5h2.8a.6.6 0 0 0 .6-.5l.2-.9a5 5 0 0 0 1-.4l.7.6a.6.6 0 0 0 .8 0l.8-.8a.6.6 0 0 0 0-.8l-.6-.7a5 5 0 0 0 .4-1l.9-.2a.6.6 0 0 0 .5-.6V6.6a.6.6 0 0 0-.5-.6Z"/></svg>
            </button>
          </div>
        </div>

        <div id="cards-view">
          <div class="tile" id="claude-provider" data-provider="claude">
            <div class="ring-item">
              <div class="ring">
                <svg class="ring-svg" viewBox="0 0 64 64" aria-hidden="true">
                  <circle class="ring-track" cx="32" cy="32" r="26" pathLength="100" />
                  <circle class="ring-fill" id="claude-bar" cx="32" cy="32" r="26" pathLength="100" transform="rotate(-90 32 32)" />
                </svg>
                <span class="ring-icon">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6c.36 0 .67.23.79.57l2.02 5.7c.05.16.18.29.34.34l5.7 2.02a.83.83 0 0 1 0 1.58l-5.7 2.02a.83.83 0 0 0-.34.34L12.79 22a.83.83 0 0 1-1.58 0l-2.02-5.7a.83.83 0 0 0-.34-.34L3.15 11.8a.83.83 0 0 1 0-1.58l5.7-2.02a.83.83 0 0 0 .34-.34L11.21 2.17A.83.83 0 0 1 12 1.6Z"/></svg>
                </span>
              </div>
              <span class="ring-value" id="claude-value">–</span>
              <span class="tile-status stale-icon" aria-hidden="true">&#9203;</span>
              <span class="tile-status error-icon" aria-hidden="true">&#9888;</span>
            </div>
            <div class="tile-body">
              <div class="flyout-head">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6c.36 0 .67.23.79.57l2.02 5.7c.05.16.18.29.34.34l5.7 2.02a.83.83 0 0 1 0 1.58l-5.7 2.02a.83.83 0 0 0-.34.34L12.79 22a.83.83 0 0 1-1.58 0l-2.02-5.7a.83.83 0 0 0-.34-.34L3.15 11.8a.83.83 0 0 1 0-1.58l5.7-2.02a.83.83 0 0 0 .34-.34L11.21 2.17A.83.83 0 0 1 12 1.6Z"/></svg>
                <span>Claude Usage</span>
              </div>
              <div class="tile-detail" id="claude-detail"></div>
              <div class="tile-sub" id="claude-reset">Loading…</div>
              <div class="tile-hint" id="claude-hint" hidden></div>
            </div>
          </div>

          <div class="tile" id="codex-provider" data-provider="codex">
            <div class="ring-item">
              <div class="ring">
                <svg class="ring-svg" viewBox="0 0 64 64" aria-hidden="true">
                  <circle class="ring-track" cx="32" cy="32" r="26" pathLength="100" />
                  <circle class="ring-fill" id="codex-bar" cx="32" cy="32" r="26" pathLength="100" transform="rotate(-90 32 32)" />
                </svg>
                <span class="ring-icon">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2 20.2 6.8v10.4L12 21.8 3.8 17.2V6.8Z"/></svg>
                </span>
              </div>
              <span class="ring-value" id="codex-value">–</span>
              <span class="tile-status stale-icon" aria-hidden="true">&#9203;</span>
              <span class="tile-status error-icon" aria-hidden="true">&#9888;</span>
            </div>
            <div class="tile-body">
              <div class="flyout-head">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2 20.2 6.8v10.4L12 21.8 3.8 17.2V6.8Z"/></svg>
                <span>Codex Usage</span>
              </div>
              <div class="tile-detail" id="codex-detail"></div>
              <div class="tile-sub" id="codex-reset">Loading…</div>
              <div class="tile-hint" id="codex-hint" hidden></div>
            </div>
          </div>

          <div class="tile" id="antigravity-provider" data-provider="antigravity">
            <div class="ring-item">
              <div class="ring">
                <svg class="ring-svg" viewBox="0 0 64 64" aria-hidden="true">
                  <circle class="ring-track" cx="32" cy="32" r="26" pathLength="100" />
                  <circle class="ring-fill" id="antigravity-bar" cx="32" cy="32" r="26" pathLength="100" transform="rotate(-90 32 32)" />
                </svg>
                <span class="ring-icon">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><ellipse cx="12" cy="12" rx="9.2" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-28 12 12)"/></svg>
                </span>
              </div>
              <span class="ring-value" id="antigravity-value">–</span>
              <span class="tile-status stale-icon" aria-hidden="true">&#9203;</span>
              <span class="tile-status error-icon" aria-hidden="true">&#9888;</span>
            </div>
            <div class="tile-body">
              <div class="flyout-head">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><ellipse cx="12" cy="12" rx="9.2" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-28 12 12)"/></svg>
                <span>Antigravity Usage</span>
              </div>
              <div class="tile-detail" id="antigravity-detail"></div>
              <div class="tile-sub" id="antigravity-reset">Loading…</div>
              <div class="tile-hint" id="antigravity-hint" hidden></div>
            </div>
          </div>

          <div class="tile" id="cursor-provider" data-provider="cursor">
            <div class="ring-item">
              <div class="ring">
                <svg class="ring-svg" viewBox="0 0 64 64" aria-hidden="true">
                  <circle class="ring-track" cx="32" cy="32" r="26" pathLength="100" />
                  <circle class="ring-fill" id="cursor-bar" cx="32" cy="32" r="26" pathLength="100" transform="rotate(-90 32 32)" />
                </svg>
                <span class="ring-icon">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.2 2.4 20.6 12.2l-8.4 2.2 1.8 8.2Z"/></svg>
                </span>
              </div>
              <span class="ring-value" id="cursor-value">–</span>
              <span class="tile-status stale-icon" aria-hidden="true">&#9203;</span>
              <span class="tile-status error-icon" aria-hidden="true">&#9888;</span>
            </div>
            <div class="tile-body">
              <div class="flyout-head">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.2 2.4 20.6 12.2l-8.4 2.2 1.8 8.2Z"/></svg>
                <span>Cursor Usage</span>
              </div>
              <div class="tile-detail" id="cursor-detail"></div>
              <div class="tile-sub" id="cursor-reset">Loading…</div>
              <div class="tile-hint" id="cursor-hint" hidden></div>
            </div>
          </div>

          <div class="tile-empty" id="empty-state" hidden>
            <span class="empty-short">No AI</span>
            <span class="empty-long">No AI providers detected on this machine</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('mode') === 'widget') {
      document.body.classList.add('widget-mode');
    }
  </script>
  <script src="renderer.js"></script>
</body>
</html>
