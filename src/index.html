<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>GenAIUsageWidget</title>
<link rel="stylesheet" href="theme.css" />
<style>
  :root {
    --pointer-offset: 40px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: transparent;
    color: var(--text-primary);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* Transparent parts of the widget window must not steal clicks from apps behind. */
  body.widget-mode,
  body.widget-mode .app,
  body.widget-mode .shell,
  body.widget-mode .panel {
    pointer-events: none;
  }

  body.widget-mode .notch,
  body.widget-mode .flyout,
  body.widget-mode .edge-peek-tab {
    pointer-events: auto;
  }

  .app {
    position: relative;
    margin: 10px;
    overflow: visible;
    max-width: 640px;
    background: transparent;
  }

  /* Shrink-wrap so docked flex shells do not leave a transparent strip on
     the docked edge (row-reverse packs to the opposite side when stretched). */
  body.widget-mode .app {
    width: max-content;
    box-sizing: border-box;
  }

  html.widget-edge-fill,
  html.widget-edge-fill body {
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  html.widget-edge-fill body.edge-right {
    display: flex;
    justify-content: flex-end;
    align-items: stretch;
  }

  html.widget-edge-fill body.edge-left {
    display: flex;
    justify-content: flex-start;
    align-items: stretch;
  }

  .shell {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 10px;
    width: max-content;
  }

  body.widget-mode.edge-left .shell {
    flex-direction: row-reverse;
  }

  body.widget-mode.edge-right .shell {
    /* Keep the notch on the docked (right) side if the shell ever stretches. */
    justify-content: flex-end;
  }

  body.widget-mode.edge-top .shell {
    flex-direction: column-reverse;
    align-items: stretch;
  }

  body.widget-mode.edge-bottom .shell {
    flex-direction: column;
    align-items: stretch;
  }

  body:not(.widget-mode) .shell {
    display: block;
  }

  .panel {
    display: none;
    flex-shrink: 0;
  }

  .panel.open {
    display: block;
  }

  body:not(.widget-mode) .panel {
    display: none !important;
  }

  .flyout {
    position: relative;
    width: 268px;
    padding: 16px 18px 14px;
    border-radius: 16px;
    background: var(--flyout);
    border: 1px solid var(--flyout-stroke);
    box-shadow: var(--shadow-flyout);
  }

  .flyout .pointer {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--flyout);
    border: 1px solid var(--flyout-stroke);
    border-left: none;
    border-bottom: none;
    transform: rotate(45deg);
    right: -6px;
    top: var(--pointer-offset);
    margin-top: -6px;
  }

  body.widget-mode.edge-left .flyout .pointer {
    right: auto;
    left: -6px;
    transform: rotate(225deg);
  }

  body.widget-mode.edge-top .flyout .pointer {
    right: auto;
    left: var(--pointer-offset);
    top: -6px;
    margin-top: 0;
    margin-left: -6px;
    transform: rotate(-45deg);
  }

  body.widget-mode.edge-bottom .flyout .pointer {
    right: auto;
    left: var(--pointer-offset);
    bottom: -6px;
    top: auto;
    margin-top: 0;
    margin-left: -6px;
    transform: rotate(135deg);
  }

  .flyout-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text-primary);
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
  }

  .flyout-head svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .flyout-error,
  .flyout-empty {
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-secondary);
  }

  .flyout-error { color: var(--critical); }

  .flyout-updated {
    margin-top: 12px;
    font-size: 10px;
    color: var(--text-muted);
  }

  .notch {
    position: relative;
    background: var(--notch);
    border: 1px solid var(--notch-stroke);
    box-shadow: var(--shadow-flyout);
  }

  /* Transparent Electron windows cannot use outer box-shadow / filter /
     borders on rounded shapes — Chromium leaves grey square corners. */
  body.widget-mode .notch {
    width: 84px;
    padding: 14px 10px;
    border-radius: 42px;
    border: none !important;
    /* An inset stroke stays inside clip-path, so it is safe here and keeps
       the pill visible on a light wallpaper. */
    box-shadow: inset 0 0 0 1px var(--notch-stroke) !important;
    filter: none !important;
    outline: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    /* clip-path follows the radius in the alpha channel more reliably
       than border-radius alone under DWM transparency. */
    clip-path: inset(0 round 42px);
    -webkit-app-region: no-drag;
    cursor: grab;
    background: var(--notch);
  }

  body.widget-mode .notch:active {
    cursor: grabbing;
  }

  body.widget-mode.edge-top .notch {
    width: auto;
    min-height: 84px;
    padding: 10px 14px;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  body.widget-mode.edge-bottom .notch {
    width: auto;
    min-height: 84px;
    padding: 10px 14px;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  body:not(.widget-mode) .notch {
    width: 300px;
    padding: 12px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  body:not(.widget-mode) #settings-panel.flyout {
    width: auto;
    padding: 4px 2px 0;
    background: transparent;
    border: none;
    box-shadow: none;
  }

  body:not(.widget-mode) .tile:not(.error-state) .tile-sub {
    display: none;
  }

  body.widget-mode .app-header {
    order: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: 8px;
    -webkit-app-region: no-drag;
    opacity: 0;
    transition: opacity 0.18s ease;
  }

  body.widget-mode.edge-left .app-header,
  body.widget-mode.edge-right .app-header {
    flex-shrink: 0;
    width: 100%;
    justify-content: center;
  }

  body.widget-mode.edge-left .app-header .app-header-actions,
  body.widget-mode.edge-right .app-header .app-header-actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  body.widget-mode .notch:hover .app-header,
  body.widget-mode .notch:focus-within .app-header,
  body.widget-mode.edge-collapsed .app-header {
    opacity: 1;
  }

  body.widget-mode .app-title,
  body.widget-mode .app-updated {
    display: none;
  }

  body.widget-mode.edge-top .app-header {
    order: 0;
    padding-top: 0;
    padding-right: 4px;
  }

  body.widget-mode.edge-bottom .app-header {
    order: 2;
    padding-top: 0;
    padding-right: 4px;
  }

  body:not(.widget-mode) .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 6px;
    gap: 8px;
  }

  .app-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .app-header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    -webkit-app-region: no-drag;
  }

  .app-updated {
    font-size: 10px;
    color: var(--text-muted);
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: background-color 0.12s ease, color 0.12s ease;
  }

  .icon-btn svg {
    width: 14px;
    height: 14px;
  }

  .icon-btn:hover {
    background: var(--control-hover);
    color: var(--text-primary);
  }

  .icon-btn:active { background: var(--control-pressed); }

  button:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 1px;
  }

  .hide-edge-btn { display: none; }

  body.widget-mode .hide-edge-btn { display: flex; }

  body.widget-mode.edge-right .app {
    /* No vertical margin — collapsed uses 0, so a top margin here shifts the pill down. */
    margin: 0 0 0 10px !important;
  }
  body.widget-mode.edge-left .app {
    margin: 0 10px 0 0 !important;
  }
  body.widget-mode.edge-top .app {
    margin: 0 10px 10px 10px !important;
  }
  body.widget-mode.edge-bottom .app {
    margin: 10px 10px 0 10px !important;
  }

  body.widget-mode.edge-collapsed .app {
    margin: 0 !important;
    padding: 0;
    width: max-content;
    max-width: none;
    overflow: visible;
    background: transparent;
  }

  /* Side pill: ring 56 + open-side pad 12 (border-box). */
  body.widget-mode.edge-right .notch {
    border-radius: 36px 0 0 36px;
    clip-path: inset(0 round 36px 0 0 36px);
    box-sizing: border-box;
    width: 69px !important;
    min-width: 69px !important;
    max-width: 69px !important;
    padding: 14px 0 14px 12px;
    align-items: stretch !important;
  }
  body.widget-mode.edge-left .notch {
    border-radius: 0 36px 36px 0;
    clip-path: inset(0 round 0 36px 36px 0);
    box-sizing: border-box;
    width: 69px !important;
    min-width: 69px !important;
    max-width: 69px !important;
    padding: 14px 12px 14px 0;
    align-items: stretch !important;
  }
  body.widget-mode.edge-top .notch {
    border-radius: 0 0 36px 36px;
    clip-path: inset(0 round 0 0 36px 36px);
  }

  body.widget-mode.edge-bottom .notch {
    border-radius: 36px 36px 0 0;
    clip-path: inset(0 round 36px 36px 0 0);
  }

  body.widget-mode.edge-collapsed.edge-top .app,
  body.widget-mode.edge-collapsed.edge-bottom .app {
    max-width: 320px;
  }

  /* Collapsed = ring pill + edge/settings controls; hide flyout chrome only. */
  body.widget-mode.edge-collapsed .panel,
  body.widget-mode.edge-collapsed .edge-peek-tab {
    display: none !important;
  }

  body.widget-mode.edge-collapsed .notch {
    overflow: hidden;
    justify-content: flex-start;
    border: none !important;
    box-shadow: inset 0 0 0 1px var(--notch-stroke) !important;
    filter: none !important;
  }

  body.widget-mode.edge-collapsed.edge-right .notch {
    padding: 14px 0 14px 12px;
    border-radius: 36px 0 0 36px;
  }

  body.widget-mode.edge-collapsed.edge-left .notch {
    padding: 14px 12px 14px 0;
    border-radius: 0 36px 36px 0;
  }

  body.widget-mode.edge-collapsed.edge-top .notch,
  body.widget-mode.edge-collapsed.edge-bottom .notch {
    padding: 10px 16px;
  }

  /* Keep the same ring spacing as expanded — a tighter gap makes lower
     rings look like they drift downward when hiding. */

  .edge-peek-tab {
    display: none;
  }

  #settings-panel[hidden],
  #flyout[hidden],
  #cards-view[hidden],
  .tile[hidden],
  .tile-empty[hidden] {
    display: none !important;
  }

  .settings-section + .settings-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
  }

  .settings-heading {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
  }

  .settings-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--ok);
    flex-shrink: 0;
  }

  .dock-edge-picker {
    position: relative;
    margin-top: 4px;
  }

  .dock-edge-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--hairline);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-primary);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .dock-edge-trigger:hover {
    background: rgba(255, 255, 255, 0.07);
  }

  .dock-edge-trigger:focus {
    outline: none;
    border-color: rgba(61, 255, 138, 0.35);
  }

  .dock-edge-trigger svg {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    color: var(--text-muted);
  }

  .dock-edge-menu {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    z-index: 20;
    margin: 0;
    padding: 4px;
    list-style: none;
    border-radius: 12px;
    border: 1px solid var(--hairline);
    background: #1a1a1a;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }

  .dock-edge-menu[hidden] {
    display: none !important;
  }

  .dock-edge-option {
    display: block;
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-primary);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }

  .dock-edge-option:hover,
  .dock-edge-option:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.08);
  }

  .dock-edge-option[aria-selected="true"] {
    background: rgba(61, 255, 138, 0.14);
    color: #fff;
  }

  .provider-toggle + .provider-toggle { margin-top: 8px; }

  .provider-toggle.disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .provider-toggle-note {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .settings-back {
    margin-top: 14px;
    align-self: flex-start;
    padding: 6px 12px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .settings-back:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
  }

  #cards-view {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  body.widget-mode #cards-view {
    width: 100%;
    align-items: center;
    gap: 12px;
  }

  body.widget-mode.edge-right #cards-view,
  body.widget-mode.edge-left #cards-view {
    align-items: center;
  }

  body.widget-mode.edge-right .tile,
  body.widget-mode.edge-left .tile {
    width: 100%;
    align-items: center !important;
  }

  body.widget-mode.edge-top #cards-view,
  body.widget-mode.edge-bottom #cards-view {
    flex-direction: row;
    width: auto;
    gap: 14px;
  }

  .tile {
    user-select: none;
  }

  body.widget-mode .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    -webkit-app-region: no-drag;
    cursor: grab;
  }

  body.widget-mode .tile .ring,
  body.widget-mode .tile .ring-value {
    cursor: pointer;
  }

  body.widget-mode .tile .ring-icon { opacity: 0.86; transition: opacity 0.15s ease; }
  body.widget-mode .tile:hover .ring-icon,
  body.widget-mode .tile.selected .ring-icon { opacity: 1; }

  body.widget-mode .tile.dragging { opacity: 0.4; }

  body:not(.widget-mode) .tile {
    padding: 14px 14px 12px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--card-stroke);
  }

  body:not(.widget-mode) .tile + .tile {
    margin-top: 0;
  }

  body:not(.widget-mode) #cards-view {
    gap: 10px;
  }

  body:not(.widget-mode) .tile.dragging { opacity: 0.45; }

  .tile-body { display: none; }

  body:not(.widget-mode) .tile-body { display: block; }

  body:not(.widget-mode) .ring-item { display: none; }

  .ring-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .ring {
    position: relative;
    width: 56px;
    height: 56px;
  }

  .ring-svg {
    width: 56px;
    height: 56px;
    overflow: hidden;
    display: block;
  }

  .ring-track,
  .ring-fill {
    fill: none;
    stroke-width: 3.6;
    shape-rendering: geometricPrecision;
  }

  .ring-track { stroke: var(--track); }

  .ring-fill {
    stroke: var(--ok);
    stroke-linecap: round;
    stroke-dasharray: 0 100;
    transition: stroke-dasharray 0.8s var(--ease-out), stroke 0.4s ease, opacity 0.2s ease;
  }

  .ring.warning .ring-fill { stroke: var(--warning); }
  .ring.critical .ring-fill { stroke: var(--critical); }

  .ring-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-on-ring);
    pointer-events: none;
  }

  .ring-icon svg {
    width: 18px;
    height: 18px;
  }

  .ring-value {
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }

  .tile-status {
    display: none;
    width: 12px;
    height: 12px;
    color: var(--text-muted);
  }

  .tile-status.error-icon { color: var(--warning); }

  .tile.stale .tile-status.stale-icon,
  .tile.error-state .tile-status.error-icon {
    display: block;
  }

  .meter {
    height: 6px;
    border-radius: 99px;
    background: var(--track);
    overflow: hidden;
  }

  .meter-fill {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: var(--ok);
    transition: width 0.8s var(--ease-out), background-color 0.4s ease;
  }

  .meter.warning .meter-fill { background: var(--warning); }
  .meter.critical .meter-fill { background: var(--critical); }

  .detail-row + .detail-row {
    margin-top: 14px;
  }

  .detail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .detail-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .detail-reset {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    text-align: right;
  }

  .detail-used {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .detail-pace {
    font-size: 11px;
    font-weight: 400;
    text-align: right;
    color: var(--text-muted);
  }

  .detail-pace.pace-limit { color: var(--warning); }

  .cost-block {
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
  }

  .cost-totals {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .cost-total {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }

  .cost-value {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .cost-caption {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cost-projects {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cost-project {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .cost-project-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cost-project-value {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .cost-more {
    font-size: 11px;
    color: var(--text-muted);
  }

  .tile-sub {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.45;
    white-space: pre-line;
  }

  body.widget-mode .tile-sub { display: none; }

  .tile-sub.error { color: var(--critical); }

  .tile-hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .tile-hint[hidden] { display: none !important; }

  /* Provider status page reports an incident (service-status.js). */
  .ring-item { position: relative; }

  .status-dot {
    display: none;
    position: absolute;
    top: 1px;
    left: calc(50% + 16px);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--notch);
    box-sizing: border-box;
    pointer-events: none;
  }

  .tile[data-status="minor"] .status-dot,
  .tile[data-status="major"] .status-dot,
  .tile[data-status="critical"] .status-dot,
  .tile[data-status="maintenance"] .status-dot { display: block; }

  .tile[data-status="minor"] .status-dot { background: var(--warning); }
  .tile[data-status="major"] .status-dot,
  .tile[data-status="critical"] .status-dot { background: var(--critical); }
  .tile[data-status="maintenance"] .status-dot { background: var(--text-muted); }

  .tile-incident {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    width: 100%;
    margin-top: 8px;
    padding: 6px 8px;
    border: none;
    border-radius: 8px;
    background: color-mix(in srgb, var(--status-color, var(--warning)) 14%, transparent);
    color: var(--text-primary);
    font: inherit;
    font-size: 11px;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }

  .tile-incident[hidden] { display: none !important; }
  .tile-incident:hover { background: color-mix(in srgb, var(--status-color, var(--warning)) 24%, transparent); }
  .tile-incident.status-minor { --status-color: var(--warning); }
  .tile-incident.status-major,
  .tile-incident.status-critical { --status-color: var(--critical); }
  .tile-incident.status-maintenance { --status-color: var(--text-muted); }

  .tile-incident .incident-mark {
    flex: none;
    width: 7px;
    height: 7px;
    margin-top: 4px;
    border-radius: 50%;
    background: var(--status-color, var(--warning));
  }

  .tile-incident .incident-label { font-weight: 600; }
  .tile-incident .incident-title { color: var(--text-secondary); }

  .tile-empty {
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  body:not(.widget-mode) .tile-empty {
    padding: 20px 12px;
    font-size: 12px;
  }

  body.widget-mode .empty-long { display: none; }
  body:not(.widget-mode) .empty-short { display: none; }

  body.compact-mode:not(.widget-mode) #cards-view { gap: 8px; }
  body.compact-mode:not(.widget-mode) .tile { padding: 10px 12px; }
  body.compact-mode:not(.widget-mode) .detail-reset { display: none; }
  body.compact-mode:not(.widget-mode) .cost-projects { display: none; }
  body.compact-mode:not(.widget-mode) .flyout-head { margin-bottom: 10px; }
  body.compact-mode.widget-mode .ring-value { display: none; }
  body.compact-mode.widget-mode .ring,
  body.compact-mode.widget-mode .ring-svg {
    width: 48px;
    height: 48px;
  }

  /* Docked pills: no stroke on the side that meets the screen edge. */
  body.widget-mode.edge-right .notch,
  body.widget-mode.edge-right.edge-collapsed .notch {
    box-shadow: inset 1px 1px 0 var(--notch-stroke), inset 0 -1px 0 var(--notch-stroke) !important;
  }
  body.widget-mode.edge-left .notch,
  body.widget-mode.edge-left.edge-collapsed .notch {

    .ring-fill, .meter-fill { transition: none; }
